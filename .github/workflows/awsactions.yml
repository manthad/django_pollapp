name: Deploy Docker to EC2
on:
  push:
    branches:
      - test
jobs:      
  deploy:
    runs-on: ubuntu-latest # or your self-hosted runner
    # needs: build-and-push
  
    steps:
      - name: Deploy to EC2
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: 
            sudo docker stop pollapp-container || true
            sudo docker rm pollapp-container || true
            sudo docker rmi manthad/django_pollapp:v2 || true
            sudo docker pull manthad/django_pollapp:v3
            sudo docker run -d --name pollapp-container -p 8000:8000 \
            -v /home/ubuntu/pollrestore:/app/db.sqlite3 \
            manthad/django_pollapp:v3

